<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  body { width: 420px; height: 280px; position: relative; }
  .graph { position: absolute; right: -20px; top: -10px; opacity: 0.6; -webkit-mask-image: linear-gradient(to bottom, #000 35%, transparent 72%); }
  .content { position: absolute; left: 36px; bottom: 40px; }
  .mark { width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
  .name { font-size: 54px; }
  .tag { font-size: 18px; margin-top: 10px; }
</style>
</head>
<body class="dark">
  <svg class="graph" width="260" height="300" viewBox="0 0 260 300" fill="none" stroke-linecap="round">
    <path d="M70 0 V300" stroke="#3a9a62" stroke-width="5"/>
    <path d="M70 210 C70 160 150 170 150 120 V40" stroke="#6cc58f" stroke-width="5"/>
    <path d="M150 90 C150 60 220 70 220 30 V0" stroke="#d9a646" stroke-width="5"/>
    <circle cx="70" cy="40" r="11" fill="#15171a" stroke="#3a9a62" stroke-width="5"/>
    <circle cx="70" cy="130" r="11" fill="#15171a" stroke="#3a9a62" stroke-width="5"/>
    <circle cx="70" cy="250" r="11" fill="#15171a" stroke="#3a9a62" stroke-width="5"/>
    <circle cx="150" cy="120" r="11" fill="#15171a" stroke="#6cc58f" stroke-width="5"/>
    <circle cx="150" cy="40" r="11" fill="#15171a" stroke="#6cc58f" stroke-width="5"/>
    <circle cx="220" cy="30" r="11" fill="#15171a" stroke="#d9a646" stroke-width="5"/>
  </svg>
  <div class="content">
    <div class="mark green">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round">
        <circle cx="8" cy="5" r="2.5"/><circle cx="8" cy="19" r="2.5"/><circle cx="17" cy="7" r="2.5"/>
        <path d="M8 7.5v9"/><path d="M8 15.5c0-4.5 9-3.5 9-6"/>
      </svg>
    </div>
    <div class="name">Vetka</div>
    <div class="tag">Git client for the Unity Editor</div>
  </div>
</body>
</html>
