<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  body { width: 1950px; height: 1300px; position: relative; }
  .graph { position: absolute; right: 60px; top: 0; opacity: 0.9; }
  .content { position: absolute; left: 150px; top: 330px; width: 980px; }
  .mark { width: 168px; height: 168px; border-radius: 40px; display: flex; align-items: center; justify-content: center; margin-bottom: 64px; box-shadow: 0 24px 60px rgba(0,0,0,0.35); }
  .name { font-size: 190px; }
  .tag { font-size: 58px; margin-top: 36px; }
  .points { display: flex; gap: 22px; margin-top: 72px; flex-wrap: wrap; }
  .point { font-size: 34px; font-weight: 600; color: #dfeee4; padding: 16px 30px; border-radius: 999px; background: rgba(108, 197, 143, 0.14); border: 2px solid rgba(108, 197, 143, 0.35); }
</style>
</head>
<body class="dark">
  <svg class="graph" width="760" height="1300" viewBox="0 0 760 1300" fill="none" stroke-linecap="round">
    <path d="M200 0 V1300" stroke="#3a9a62" stroke-width="16"/>
    <path d="M200 1010 C200 850 430 880 430 720 V330" stroke="#6cc58f" stroke-width="16"/>
    <path d="M430 520 C430 420 640 450 640 330 V140" stroke="#d9a646" stroke-width="16"/>
    <path d="M640 140 C640 60 200 120 200 40" stroke="#d9a646" stroke-width="16" opacity="0.55"/>
    <path d="M430 330 C430 250 200 290 200 200" stroke="#6cc58f" stroke-width="16" opacity="0.55"/>
    <g fill="#15171a" stroke-width="16">
      <circle cx="200" cy="200" r="34" stroke="#3a9a62"/>
      <circle cx="200" cy="560" r="34" stroke="#3a9a62"/>
      <circle cx="200" cy="1010" r="34" stroke="#3a9a62"/>
      <circle cx="200" cy="1210" r="34" stroke="#3a9a62"/>
      <circle cx="430" cy="720" r="34" stroke="#6cc58f"/>
      <circle cx="430" cy="520" r="34" stroke="#6cc58f"/>
      <circle cx="430" cy="330" r="34" stroke="#6cc58f"/>
      <circle cx="640" cy="330" r="34" stroke="#d9a646"/>
      <circle cx="640" cy="140" r="34" stroke="#d9a646"/>
    </g>
  </svg>
  <div class="content">
    <div class="mark green">
      <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round">
        <circle cx="8" cy="5" r="2.5"/><circle cx="8" cy="19" r="2.5"/><circle cx="17" cy="7" r="2.5"/>
        <path d="M8 7.5v9"/><path d="M8 15.5c0-4.5 9-3.5 9-6"/>
      </svg>
    </div>
    <div class="name">Vetka</div>
    <div class="tag">Git client for the Unity Editor</div>
    <div class="points">
      <span class="point">Commit &amp; Push</span>
      <span class="point">Branches</span>
      <span class="point">Rollback on conflict</span>
    </div>
  </div>
</body>
</html>
